   <h1> EVENTS</h1>
   <br>
   <div class="info-container hidden" id="eventMaker" style="gap: 10px; padding-right: 30px;">
      <div class="aligned-form">
   
        <label for="eventHost">Host Name:</label>
        <input type="text" id="eventHost" name="eventHost" placeholder="Enter Host name">
        

         <label for="eventImage">Event Image:</label>
        <input type="file" id="eventImage" name="eventImage" accept="image/*">
   

        <label for="eventName">Event Name:</label>
        <input type="text" id="eventName" name="eventName" placeholder="Enter event name">
    

        <label for="eventDescription">Event Description:</label>
        <textarea style="resize: none;" id="eventDescription" name="eventDescription" placeholder="Enter event description"></textarea>
    

    
        <label for="eventPrize">Event Prize:</label>
        <input type="text" id="eventPrize" name="eventPrize" placeholder="Enter event prize">
    

    
        <label for="eventDate">Event Date:</label>
        <input type="date" id="eventDate" name="eventDate">

    
        <button type="button" onclick="addNewEvent()">Create Event</button>
        
    </div>
   </div>


<br>
    <button class="action-btn" id="eventShow" onclick="hide()">Make an Event</button><br><br>
   
   
    <div class="events-grid" id="eventDisplay">

      </div>
